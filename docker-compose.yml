version: '3.9'

services:
  gem:
    build:
      context: .
      args:
        RUBY_VERSION:         3.3.11-slim-bookworm # The version that gets installed by docker
        RUBY_GENERAL_VERSION: 3.3.0                # The version that gems are stored under on the filesystem
        BUNDLE_VERSION:       4.0.15
    volumes:
      - gem_cache:/gems
      - .:/app
    networks:
      default:

volumes:
  gem_cache:

networks:
  default:
